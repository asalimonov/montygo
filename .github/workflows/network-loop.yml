name: network-loop

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  MONTY_REV: f8acf4fa8fff78dfd11dc5a2042e4fdf0ab36c28
  ITERATIONS: "12"

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Check out upstream Monty
        uses: actions/checkout@v7
        with:
          repository: pydantic/monty
          ref: ${{ env.MONTY_REV }}
          path: monty-src
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            tests/network/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: make docker-build PLATFORMS=linux/arm64 MONTY_SRC=monty-src
      - name: Network tests in a loop
        run: |
          mkdir -p tests/network/output
          fails=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::iteration $i"
            make test-network 2>&1 | tee "tests/network/output/run-$i.log" | grep -E "^(ok|FAIL|---|\s+\S+_test.go:|\s+server log|\s+receiver)" || true
            if grep -q "^FAIL" "tests/network/output/run-$i.log"; then fails=$((fails+1)); fi
            echo "::endgroup::"
          done
          echo "failed iterations: $fails"
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-loop-arm64
          path: tests/network/output/
          if-no-files-found: ignore
