[package]
name = "monty-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "monty_server"
path = "src/lib.rs"

[[bin]]
name = "monty-server"
path = "src/main.rs"

[dependencies]
monty-pool = { git = "https://github.com/pydantic/monty", rev = "f8acf4fa", features = ["telemetry"] }
monty-proto = { git = "https://github.com/pydantic/monty", rev = "f8acf4fa" }
monty-types = { git = "https://github.com/pydantic/monty", rev = "f8acf4fa" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"
prost = "=0.14.4"
clap = { version = "4.6", features = ["derive", "env"] }
hmac = "0.12.1"
sha2 = "0.10.9"
prometheus-client = "0.25.1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs", "trace", "internal-logs", "experimental-http-retry"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
logfire = { version = "0.12", default-features = false, features = ["export-http-protobuf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tokio-tungstenite = "0.27"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
