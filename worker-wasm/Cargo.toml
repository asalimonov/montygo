[package]
name = "monty-wasi-worker"
version = "0.0.23"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "monty-wasi-worker"
path = "src/main.rs"

[dependencies]
monty-proto = { git = "https://github.com/pydantic/monty", rev = "f8acf4fa", features = ["worker"] }
monty-alloc = { git = "https://github.com/pydantic/monty", rev = "f8acf4fa", features = ["exit-code"] }
monty-types = { git = "https://github.com/pydantic/monty", rev = "f8acf4fa" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace]
